name: doctordesk
description: DoctorDesk Mobile App
publish_to: 'none'
version: 1.0.0+1
environment:
  sdk: '>=3.0.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  cupertino_icons: ^1.0.6
  shared_preferences: ^2.2.2
  geolocator: ^13.0.2
  google_fonts: ^6.1.0
  firebase_core: ^4.14.0
  firebase_auth: ^6.6.1
  firebase_storage: ^13.5.0
  image_picker: ^1.1.2
  flutter_tts: ^4.2.2
  cloud_firestore: ^6.10.0
  dart_geohash: ^2.1.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/app_icon.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/images/
